[package]
name = "fishtank"
version = "0.1.0"
edition = "2024"
description = "k9s-style TUI for inspecting bare-metal BMCs over IPMI and Redfish (built on ratata)"
authors = ["GeertJohan <git@geertjohan.net>"]
build = "build.rs"
license = "MIT"
readme = "README.md"
repository = "https://github.com/GeertJohan/fishtank"
homepage = "https://github.com/GeertJohan/fishtank"
keywords = ["tui", "ipmi", "redfish", "bmc", "ratatui"]
categories = ["command-line-utilities"]
# Edition 2024 needs 1.85; `is_multiple_of` (used in the mock backend) needs 1.87.
rust-version = "1.87"
# Dev-only tooling: kept in the git repo, left out of the published crate.
exclude = [
    "AGENT.justfile",
    "Justfile",
    "agent-zsh",
    "TODO-logs-console.md",
    ".envrc",
    ".mise.toml",
    ".github",
]

[dependencies]
arc-swap = "1"
better-panic = "0.3.0"
clap = { version = "4.5.20", features = [
    "derive",
    "cargo",
    "wrap_help",
    "unicode",
    "string",
    "unstable-styles",
] }
color-eyre = "0.6.3"
crossterm = { version = "0.28.1", features = ["serde", "event-stream"] }
directories = "5.0.1"
futures = "0.3.31"
human-panic = "2.0.2"
json5 = "0.4.1"
lazy_static = "1.5.0"
libc = "0.2.161"
ratatui = { version = "0.29.0", features = ["serde", "macros"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1.0.211", features = ["derive"] }
serde_json = "1.0.132"
signal-hook = "0.3.17"
strip-ansi-escapes = "0.2.0"
tokio = { version = "1.40.0", features = ["full"] }
tokio-util = "0.7.12"
tracing = "0.1.40"
tracing-error = "0.2.0"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "serde"] }

[build-dependencies]
anyhow = "1.0.90"
# Pinned: vergen 9.1.0 bumped vergen-lib to 9.x while vergen-gix still expects
# vergen-lib 0.1.x, so an unpinned resolve pulls two vergen-lib versions and the
# build script fails to compile. This pair (vergen 9.0.6 + vergen-gix 1.0.9)
# resolves to a single vergen-lib 0.1.6.
vergen = "=9.0.6"
vergen-gix = { version = "=1.0.9", features = ["build", "cargo"] }

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
